[workspace]
members = ["macros"]

[workspace.package]
description = "Internalization unified"
version = "0.0.0"
edition = "2024"
publish = false

[package]
name = "interly"
description.workspace = true
version.workspace = true
edition.workspace = true

[workspace.dependencies]
camino = "1.2.2"
fluent = "0.17.0"
fluent-syntax = "0.12.0"
heck = "0.5.0"
intl-memoizer = "0.5.3"
once_cell = "1.21.4"
proc-macro2 = "1"
quote = "1"
syn = "2"
unic-langid = { version = "0.9.6", features = [ "macros" ] }

interly-macros = { path = "macros" }

[dependencies]
fluent.workspace = true
intl-memoizer.workspace = true
once_cell.workspace = true
unic-langid.workspace = true

interly-macros.workspace = true
